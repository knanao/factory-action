name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Dead Code and Unused Dependencies
        run: bun run knip

      - name: Module Boundaries
        run: bun run depcruise

      - name: Duplicate Code
        run: bun run jscpd

      - name: File Sizes
        run: bun run check:size

      - name: Tech-Debt Markers
        run: bun run check:todos

      - name: AGENTS.md References
        run: bun run check:agents-md

      - name: Test
        run: bun run ci-test
