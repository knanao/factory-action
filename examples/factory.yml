# Delegate tasks to Factory Droid with "@factory ..." on issues and PRs.
name: Factory

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  delegate:
    # Outside users never start the job: the run shows up as skipped.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
      github.event.review.author_association ||
      github.event.issue.author_association) &&
      contains(github.event.comment.body || github.event.review.body ||
      github.event.issue.body, '@factory')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    concurrency:
      group:
        factory-${{ github.event.issue.number ||
        github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: knanao/factory-action@v0.1.1
        with:
          factory-api-key: ${{ secrets.FACTORY_API_KEY }}
          computer-id: ${{ vars.FACTORY_COMPUTER_ID }}
